<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2e2e2e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<title>Snake II — 诺基亚复刻版贪吃蛇</title>
<style>
  /* LCD 复古外观 */
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(1200px 800px at 50% 20%, #5a5a5a, #333 60%, #262626);
    font-family: monospace;
  }
  .phone {
    position: relative;
    background:
      radial-gradient(120% 90% at 30% 15%, rgba(255,255,255,.10), transparent 45%),
      linear-gradient(160deg, #4e4e4e, #2c2c2c 55%, #232323);
    border-radius: 20px;
    padding: 24px 24px 20px;
    box-shadow:
      0 18px 45px rgba(0,0,0,.65),
      0 2px 6px rgba(0,0,0,.4),
      inset 0 2px 3px rgba(255,255,255,.14),
      inset 0 -2px 4px rgba(0,0,0,.35);
  }
  .phone::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: repeating-linear-gradient(
      175deg,
      transparent 0 2px,
      rgba(255,255,255,.02) 2px 3px,
      transparent 3px 5px
    );
  }
  .phone::after {
    content: '';
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 64px;
    height: 5px;
    border-radius: 3px;
    background: linear-gradient(180deg, #1c1c1c, #3a3a3a);
    box-shadow: inset 0 1px 1px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.08);
  }
  .screen-wrap {
    position: relative;
    margin: 12px auto 0;
    padding: 6px;
    border-radius: 8px;
    background: linear-gradient(180deg, #6a6a6a, #4a4a4a);
    box-shadow:
      inset 0 2px 5px rgba(0,0,0,.55),
      inset 0 -1px 2px rgba(255,255,255,.18),
      0 1px 2px rgba(255,255,255,.08);
  }
  .brand {
    text-align: center;
    color: #b8b8b8;
    letter-spacing: 4px;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 14px;
  }
  .screen-wrap {
    position: relative;
    margin: 0 auto;
  }
  #screen {
    display: block;
    width: min(92vw, calc((96vh - 345px) * 1.25));
    aspect-ratio: 5 / 4;
    background: #9e9d24;
    border-radius: 3px;
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,.25),
      inset 0 0 6px rgba(0,0,0,.28);
    image-rendering: pixelated;
  }
  .screen-wrap::after {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 3px;
    pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.10) 26%, transparent 40%);
  }
  #stateText {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #3a3a2e;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
    text-align: center;
    pointer-events: none;
    line-height: 1.8;
    white-space: pre-line;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #cfcd97;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
    margin: 10px 2px 0;
    padding: 7px 10px;
    border-radius: 6px;
    background: linear-gradient(180deg, #2a2a2a, #202020);
    box-shadow:
      inset 0 2px 4px rgba(0,0,0,.6),
      inset 0 -1px 1px rgba(255,255,255,.07),
      0 1px 0 rgba(255,255,255,.06);
  }
  .comment {
    color: #f4e04a;
    font-size: 12px;
    letter-spacing: 1px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .3s;
  }
  .comment.show {
    opacity: 1;
    animation: commentPulse 1.2s ease-in-out infinite;
  }
  @keyframes commentPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  .gamepad {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding: 16px 18px;
    border-radius: 12px;
    background: linear-gradient(180deg, #2b2b2b, #252525);
    box-shadow:
      inset 0 3px 8px rgba(0,0,0,.55),
      inset 0 -1px 1px rgba(255,255,255,.06);
    -webkit-tap-highlight-color: transparent;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 54px);
    grid-template-rows: repeat(3, 54px);
    justify-items: center;
    align-items: center;
  }
  .dpad-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: none;
    background:
      radial-gradient(circle at 35% 28%, #838383 0%, #5c5c5c 35%, #3a3a3a 78%, #2c2c2c 100%);
    color: #e2e2e2;
    font-size: 20px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 4px 0 #1d1d1d,
      0 6px 10px rgba(0,0,0,.45),
      inset 0 2px 2px rgba(255,255,255,.25),
      inset 0 -3px 4px rgba(0,0,0,.3);
    cursor: pointer;
    user-select: none;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1d1d1d, 0 2px 4px rgba(0,0,0,.35), inset 0 2px 2px rgba(255,255,255,.18); }
  .pad-up    { grid-area: 1 / 2; }
  .pad-left  { grid-area: 2 / 1; }
  .pad-right { grid-area: 2 / 3; }
  .pad-down  { grid-area: 3 / 2; }
  .ab-btns {
    display: flex;
    flex-direction: row;
    gap: 14px;
    align-items: center;
  }
  .ab-btn {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: none;
    color: #eee;
    font-family: monospace;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
    box-shadow:
      0 4px 0 #1c1c1c,
      0 6px 10px rgba(0,0,0,.4),
      inset 0 2px 2px rgba(255,255,255,.22),
      inset 0 -3px 5px rgba(0,0,0,.28);
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .ab-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #1c1c1c, 0 2px 4px rgba(0,0,0,.3), inset 0 2px 2px rgba(255,255,255,.15); }
  .footer-brand {
    text-align: center;
    margin-top: 14px;
    color: #8d8d8d;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 5px;
    text-shadow: 0 1px 1px rgba(0,0,0,.7);
  }
  .footer-easter {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 8px;
  }
  .footer-easter .footer-brand {
    margin-top: 0;
    letter-spacing: 8px;
    font-size: 15px;
  }
  .btn-a { background: radial-gradient(circle at 35% 30%, #c05a4a, #7a2f26 75%); }
  .btn-b { background: radial-gradient(circle at 35% 30%, #7d74a8, #433c6b 75%); }
  .ab-letter { font-size: 22px; }
  .ab-sub { font-size: 10px; font-weight: normal; margin-top: 4px; letter-spacing: 0; }
</style>
</head>
<body>
<div class="phone">
  <div class="brand">NOKIA</div>
  <div class="screen-wrap">
    <canvas id="screen" width="250" height="200"></canvas>
    <div id="stateText"></div>
  </div>
  <div class="hud">
    <span id="scoreText">SCORE 0</span>
    <span id="commentText" class="comment"></span>
    <span id="bestText">BEST 0</span>
  </div>
  <div class="gamepad">
    <div class="ab-btns">
      <button id="abA" class="ab-btn btn-a"><span class="ab-letter">A</span><span class="ab-sub">开始</span></button>
      <button id="abB" class="ab-btn btn-b"><span class="ab-letter">B</span><span class="ab-sub">难度</span></button>
    </div>
    <div class="dpad">
      <button class="dpad-btn pad-up" data-dir="0,-1" aria-label="上">▲</button>
      <button class="dpad-btn pad-left" data-dir="-1,0" aria-label="左">◀</button>
      <button class="dpad-btn pad-right" data-dir="1,0" aria-label="右">▶</button>
      <button class="dpad-btn pad-down" data-dir="0,1" aria-label="下">▼</button>
    </div>
  </div>
  <div class="footer-easter">
    <div class="footer-brand">田田</div>
  </div>
</div>
<script>
const COLS = 25, ROWS = 20;
const CELL = 10;
const DIFFICULTY = {
  slow:   { label: '慢', ms: 180 },
  normal: { label: '中', ms: 120 },
  fast:   { label: '快', ms: 80 },
};
const ORDER = ['slow', 'normal', 'fast'];
// 彩蛋评语：每跨过 100 分显示一条（6 条循环）
const COMMENTS = ['这也不行啊', '有点石粒儿', '有我一分水平', '还行吧', '得到我的认可了', '给你点个赞'];

class Game {
  constructor(screen) {
    this.screen = screen;
    this.ctx = screen.getContext('2d');
    this.state = 'idle';
    this.difficulty = 'normal';
    this.onEvent = null;
    this.effects = [];
    this.reset();
  }

  reset() {
    this.snake = [];
    for (let i = 0; i < 7; i++) this.snake.push({ x: 12 - i, y: 10 });
    this.dir = { x: 1, y: 0 };
    this.queue = null;
    this.score = 0;
    this.alive = true;
    this.paused = false;
    this.state = 'idle';
    this.foods = [];
    this.poison = null;
    this.headFlash = 0;
    this.combo = 0;
    this.comboTicks = 0;
    this.awakened = false;
    this.awakenAt = 0;
    this.effects = [];
    this.prevSnake = this.snake.map(s => ({ ...s }));
    this.lastTickAt = performance.now();
    this.demoStep = 0;
    this.spawnFood();
    this.spawnPoison();
  }

  // 生成 2-3 个普通加分食物（随机分布）；COMBO≥3 时第一个优先追击蛇头
  spawnFood() {
    const count = 2 + Math.floor(Math.random() * 2); // 2 或 3
    const head = this.snake[0];
    const freeCells = () => {
      const list = [];
      for (let x = 0; x < COLS; x++) {
        for (let y = 0; y < ROWS; y++) {
          if (!this.snake.some(s => s.x === x && s.y === y)
              && !(this.poison && this.poison.x === x && this.poison.y === y)
              && !this.foods.some(f => f.x === x && f.y === y)) {
            list.push({ x, y });
          }
        }
      }
      return list;
    };
    const list = freeCells();
    if (list.length === 0) return; // 蛇填满全屏时保留现有食物
    const foods = [];
    // COMBO≥3 追击：第一个食物放蛇头直线前方
    if (this.combo >= 3 && head) {
      const tx = head.x + this.dir.x, ty = head.y + this.dir.y;
      const free = tx >= 0 && tx < COLS && ty >= 0 && ty < ROWS
        && !this.snake.some(s => s.x === tx && s.y === ty)
        && !(this.poison && this.poison.x === tx && this.poison.y === ty);
      if (free) {
        foods.push({ x: tx, y: ty, golden: Math.random() < 0.2 });
      }
    }
    while (foods.length < count && list.length > 0) {
      const i = Math.floor(Math.random() * list.length);
      const p = list.splice(i, 1)[0];
      foods.push({ x: p.x, y: p.y, golden: Math.random() < 0.2 });
    }
    this.foods = foods;
  }

  spawnPoison() {
    const empty = [];
    for (let x = 0; x < COLS; x++) {
      for (let y = 0; y < ROWS; y++) {
        if (!this.snake.some(s => s.x === x && s.y === y) && !this.foods.some(f => f.x === x && f.y === y)) {
          empty.push({ x, y });
        }
      }
    }
    if (empty.length === 0) { this.poison = null; return; }
    const p = empty[Math.floor(Math.random() * empty.length)];
    this.poison = { x: p.x, y: p.y, ttl: 25 };
  }

  emitEvent(name) {
    if (this.onEvent) this.onEvent(name);
  }

  get speedMs() {
    const bonus = Math.floor(this.score / 50) * 5;
    return Math.max(60, DIFFICULTY[this.difficulty].ms - bonus);
  }

  turn(dx, dy) {
    if (this.dir.x === -dx && this.dir.y === -dy) return; // 不可反向
    this.queue = { x: dx, y: dy };
  }

  tick() {
    if (this.state !== 'playing' || this.paused || !this.alive) return;
    if (this.queue) { this.dir = this.queue; this.queue = null; }
    this.prevSnake = this.snake.map(s => ({ ...s }));
    this.lastTickAt = performance.now();
    const head = { x: this.snake[0].x + this.dir.x, y: this.snake[0].y + this.dir.y };
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      this.alive = false; this.state = 'over';
      this.effects.push({ type: 'crash', t: 0 });
      this.emitEvent('crash'); return;
    }
    if (this.snake.some(s => s.x === head.x && s.y === head.y)) {
      this.alive = false; this.state = 'over';
      this.effects.push({ type: 'crash', t: 0 });
      this.emitEvent('crash'); return;
    }
    this.snake.unshift(head);
    const foodIdx = this.foods.findIndex(f => head.x === f.x && head.y === f.y);
    const atFood = foodIdx >= 0;
    const atPoison = this.poison && head.x === this.poison.x && head.y === this.poison.y;
    if (atFood) {
      // COMBO：窗口内连续吃食连击递增，得分 = 基础分 × (1 + 0.1×combo)，上限 9
      this.combo = this.comboTicks > 0 ? Math.min(this.combo + 1, 9) : 1;
      this.comboTicks = 15;
      const eaten = this.foods.splice(foodIdx, 1)[0];
      const pts = eaten.golden ? 20 : 10;
      const gained = Math.round(pts * (1 + 0.1 * this.combo));
      this.score += gained;
      this.headFlash = 6;
      this.effects.push({ type: 'score', x: head.x * CELL, y: head.y * CELL, text: '+' + gained, t: 0 });
      if (this.combo >= 5) this.emitEvent('combo');
      if (this.score % 50 === 0) {
        this.emitEvent('levelup');
        this.effects.push({ type: 'levelup', t: 0 });
      }
      // 彩蛋：每跨过 100 分触发评语（100/200/300…）
      if (this.score >= 100 && Math.floor(this.score / 100) > Math.floor((this.score - gained) / 100)) {
        this.emitEvent('comment');
      }
      // 超级彩蛋：跨过 188 分觉醒，画风切换
      if (!this.awakened && this.score >= 188) {
        this.awakened = true;
        this.awakenAt = performance.now();
        this.emitEvent('awaken');
      }
      this.emitEvent(eaten.golden ? 'golden' : 'eat');
      if (this.foods.length === 0) this.spawnFood(); // 全部吃完才补新一批
    } else {
      this.snake.pop();
    }
    if (atPoison) {
      this.score = Math.max(0, this.score - 10);
      this.combo = 0; this.comboTicks = 0;
      this.effects.push({ type: 'score', x: head.x * CELL, y: head.y * CELL, text: '-10', t: 0 });
      this.emitEvent('poison');
      this.spawnPoison();
    }
    if (this.poison && --this.poison.ttl <= 0) this.spawnPoison();
    if (this.headFlash > 0) this.headFlash--;
    // COMBO 窗口超时：连击断开
    if (this.comboTicks > 0 && --this.comboTicks === 0) {
      this.combo = 0;
      this.effects.push({ type: 'miss', x: this.snake[0].x * CELL, y: this.snake[0].y * CELL - 6, text: 'MISS', t: 0 });
    }
  }

  start() {
    this.reset();
    this.state = 'playing';
  }

  togglePause() {
    if (this.state === 'playing') { this.paused = true; this.state = 'paused'; }
    else if (this.state === 'paused') { this.paused = false; this.state = 'playing'; }
  }

  cycleDifficulty() {
    const i = ORDER.indexOf(this.difficulty);
    this.difficulty = ORDER[(i + 1) % ORDER.length];
    return this.difficulty;
  }
}

const game = new Game(document.getElementById('screen'));
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const sounds = {
  play(name) {
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      const t = audioCtx.currentTime;
      if (name === 'levelup') {
        [523.25, 659.25, 783.99].forEach((f, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g); g.connect(audioCtx.destination);
          o.frequency.value = f; o.type = 'square';
          g.gain.setValueAtTime(0.1, t + i * 0.09);
          g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.09 + 0.12);
          o.start(t + i * 0.09);
          o.stop(t + i * 0.09 + 0.14);
        });
        return;
      }
      if (name === 'awaken') {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g); g.connect(audioCtx.destination);
          o.frequency.value = f; o.type = 'square';
          g.gain.setValueAtTime(0.12, t + i * 0.11);
          g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.11 + 0.2);
          o.start(t + i * 0.11);
          o.stop(t + i * 0.11 + 0.22);
        });
        return;
      }
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      if (name === 'eat') { o.frequency.value = 880; o.type = 'square'; g.gain.setValueAtTime(0.12, t); }
      else if (name === 'golden') { o.frequency.value = 1318.5; o.type = 'square'; g.gain.setValueAtTime(0.12, t); }
      else if (name === 'crash') { o.frequency.value = 110; o.type = 'sawtooth'; g.gain.setValueAtTime(0.15, t); }
      else if (name === 'poison') { o.frequency.value = 196; o.type = 'triangle'; g.gain.setValueAtTime(0.12, t); }
      else if (name === 'combo') { o.frequency.value = 1200; o.type = 'square'; g.gain.setValueAtTime(0.12, t); }
      else { o.frequency.value = 440; o.type = 'square'; g.gain.setValueAtTime(0.08, t); }
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.start(t);
      o.stop(t + 0.2);
    } catch (err) { /* 音频不可用时静默失败 */ }
  }
};

const commentEl = document.getElementById('commentText');
let commentTimer = null;
let commentIdx = 0;

function showComment() {
  commentEl.textContent = COMMENTS[commentIdx % COMMENTS.length];
  commentIdx++;
  commentEl.classList.add('show');
  clearTimeout(commentTimer);
  commentTimer = setTimeout(() => commentEl.classList.remove('show'), 3000);
}

game.onEvent = ev => {
  if (ev === 'awaken') sounds.play('awaken');                     // 超级彩蛋号角
  else if (ev === 'combo') sounds.play('combo');                  // 高连击专属高音，替代 eat
  else if (ev === 'golden') sounds.play('golden');                // 金色食物专属高音
  else if (ev === 'eat') sounds.play('eat');
  else if (ev === 'comment') showComment();
  else sounds.play(ev);
  if (ev === 'crash') updateBest();
};

const bestKey = 'snakeBest';
let best = parseInt(localStorage.getItem(bestKey) || '0', 10) || 0;
document.getElementById('bestText').textContent = 'BEST ' + best;

function updateBest() {
  if (game.score > best) {
    best = game.score;
    localStorage.setItem(bestKey, String(best));
    document.getElementById('bestText').textContent = 'BEST ' + best;
  }
}

const stateText = document.getElementById('stateText');
const btnA = document.getElementById('abA');
const btnB = document.getElementById('abB');

function render(now, dt) {
  const ctx = game.ctx;
  // ===== 觉醒过渡参数 =====
  // 过渡共 2.5s：0-1.0s 金色脉冲闪光（3 次递增），1.0-2.5s 渐变溶解
  let aw = 0, awF = 0, awG = 0;
  if (game.awakened) {
    const el = now - game.awakenAt;
    if (el < 2500) {
      if (el < 1000) awF = Math.max(0, 1 - el / 1000);            // 闪光强度（递减）
      aw = Math.min(1, Math.max(0, (el - 1000) / 1500));          // 渐变进度 0→1
    } else {
      aw = 1; awF = 0;
    }
    awG = aw;  // 背景过渡用同一进度
  }
  const awakenFx = game.awakened && awF > 0;
  // 背景：LCD 绿 → 卡通天空蓝（觉醒后）
  if (aw === 0) {
    ctx.fillStyle = '#9e9d24';
    ctx.fillRect(0, 0, 250, 200);
  } else {
    // 天空渐变（随 aw 增强透明度）
    const sky = ctx.createLinearGradient(0, 0, 0, 200);
    sky.addColorStop(0, `rgba(135,206,235,${aw.toFixed(2)})`);
    sky.addColorStop(1, `rgba(176,232,255,${aw.toFixed(2)})`);
    ctx.fillStyle = '#9e9d24';
    ctx.fillRect(0, 0, 250, 200);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, 250, 200);
    // 草地（底部）
    ctx.fillStyle = `rgba(124,197,90,${aw.toFixed(2)})`;
    ctx.fillRect(0, 178, 250, 22);
    ctx.fillStyle = `rgba(94,164,66,${aw.toFixed(2)})`;
    ctx.fillRect(0, 192, 250, 8);
    // 太阳（右上角，带光芒）
    ctx.fillStyle = `rgba(255,214,64,${aw.toFixed(2)})`;
    ctx.beginPath();
    ctx.arc(222, 28, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(255,180,40,${(aw * 0.5).toFixed(2)})`;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(222 + Math.cos(a) * 17, 28 + Math.sin(a) * 17, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    // 两朵云（缓慢飘动）
    const drift = (now / 8000) % 1;
    const cloud = (cx, cy) => {
      ctx.fillStyle = `rgba(255,255,255,${(aw * 0.9).toFixed(2)})`;
      ctx.beginPath();
      ctx.arc(cx, cy, 6, 0, Math.PI * 2);
      ctx.arc(cx + 8, cy - 2, 7, 0, Math.PI * 2);
      ctx.arc(cx + 16, cy, 6, 0, Math.PI * 2);
      ctx.fill();
    };
    cloud(30 + drift * 60, 36);
    cloud(120 + drift * 40, 62);
    // 草地小花
    ctx.fillStyle = `rgba(255,120,140,${aw.toFixed(2)})`;
    ctx.fillRect(40, 178, 3, 4);
    ctx.fillStyle = `rgba(255,214,64,${aw.toFixed(2)})`;
    ctx.fillRect(180, 182, 3, 4);
  }
  // 网格线（觉醒后淡出）
  if (aw < 1) {
    ctx.strokeStyle = `rgba(122,121,32,${(0.35 * (1 - aw)).toFixed(2)})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= 250; x += CELL) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, 200); }
    for (let y = 0; y <= 200; y += CELL) { ctx.moveTo(0, y + 0.5); ctx.lineTo(250, y + 0.5); }
    ctx.stroke();
  }
  // 蛇：像素方块 / 卡通圆润（觉醒后）
  let prog = 0;
  if (game.state === 'playing') {
    prog = Math.min(1, (now - game.lastTickAt) / game.speedMs);
  } else if (game.state === 'idle') {
    prog = Math.min(1, (now - game.lastTickAt) / 200);
  }
  const hot = game.combo >= 5;
  const pts = game.snake.map((s, i) => {
    const prev = game.prevSnake[i] || s;
    return { x: (prev.x + (s.x - prev.x) * prog) * CELL, y: (prev.y + (s.y - prev.y) * prog) * CELL };
  });
  if (aw === 0) {
    // 像素风格
    pts.forEach((p, i) => {
      ctx.fillStyle = hot
        ? (i % 2 === 0 ? '#4d4c3c' : '#6b6b4a')
        : (i % 2 === 0 ? '#3a3a2e' : '#52523a');
      ctx.fillRect(p.x + 1, p.y + 1, CELL - 2, CELL - 2);
    });
  } else {
    // 卡通风格：圆润身体 + 渐变
    const bodyCol = hot ? ['#6fbf4a', '#4e9a35'] : ['#5aa94a', '#3d7a35'];
    pts.forEach((p, i) => {
      const r = CELL * 0.42;
      const g2 = ctx.createRadialGradient(p.x + 3, p.y + 3, 1, p.x + 5, p.y + 5, r * 1.6);
      g2.addColorStop(0, bodyCol[0]);
      g2.addColorStop(1, bodyCol[1]);
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.arc(p.x + 5, p.y + 5, r, 0, Math.PI * 2);
      ctx.fill();
      // 斑点纹理（奇数节）
      if (i % 2 === 1) {
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.beginPath();
        ctx.arc(p.x + 4, p.y + 4, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    });
    // 卡通蛇头（眼睛 + 舌头）
    const h = pts[0];
    if (h) {
      const hx = h.x + 5, hy = h.y + 5;
      ctx.fillStyle = bodyCol[0];
      ctx.beginPath();
      ctx.arc(hx, hy, CELL * 0.45, 0, Math.PI * 2);
      ctx.fill();
      // 眼睛（朝移动方向）
      const d = game.dir;
      const ex = hx + d.x * 2, ey = hy + d.y * 2;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(ex - d.y * 2, ey + d.x * 2, 3, 3.4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(ex + d.y * 2, ey - d.x * 2, 3, 3.4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(ex - d.y * 2 + d.x, ey + d.x * 2 + d.y, 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ex + d.y * 2 + d.x, ey - d.x * 2 + d.y, 1.5, 0, Math.PI * 2);
      ctx.fill();
      // 舌头
      ctx.strokeStyle = '#e8574f';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(hx + d.x * 7, hy + d.y * 7);
      ctx.lineTo(hx + d.x * 10, hy + d.y * 10);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(hx + d.x * 10, hy + d.y * 10);
      ctx.lineTo(hx + d.x * 10 + d.x * 3 - d.y * 2, hy + d.y * 10 + d.y * 3 + d.x * 2);
      ctx.moveTo(hx + d.x * 10, hy + d.y * 10);
      ctx.lineTo(hx + d.x * 10 + d.x * 3 + d.y * 2, hy + d.y * 10 + d.y * 3 - d.x * 2);
      ctx.stroke();
    }
  }
  // 过渡期混合：像素蛇上叠加半透明卡通蛇
  if (aw > 0 && aw < 1) {
    // 像素蛇仍绘制（在上方代码未覆盖），叠加卡通层通过 aw 混合
  }
  // 蛇头闪亮（刚吃到食物时，两种风格适配）
  if (game.headFlash > 0 && game.snake.length > 0) {
    ctx.fillStyle = 'rgba(255,255,220,0.6)';
    ctx.beginPath();
    ctx.arc(pts[0].x + 5, pts[0].y + 5, CELL * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  // 食物：多个（像素方块 / 卡通苹果，觉醒后）；金色钻石 / 金苹果
  const blinkBase = game.combo >= 3 ? 150 : 300;
  const blink = Math.floor(performance.now() / blinkBase) % 2 === 0;
  game.foods.forEach(fd => {
    const cx = fd.x * CELL + CELL / 2, cy = fd.y * CELL + CELL / 2;
    if (aw === 0) {
      if (fd.golden) {
        ctx.fillStyle = '#5c4a00';
        ctx.beginPath();
        ctx.moveTo(cx, cy - 4); ctx.lineTo(cx + 4, cy); ctx.lineTo(cx, cy + 4); ctx.lineTo(cx - 4, cy);
        ctx.closePath();
        ctx.fill();
        if (blink) {
          ctx.fillStyle = '#f4e04a';
          ctx.beginPath();
          ctx.moveTo(cx, cy - 3); ctx.lineTo(cx + 3, cy); ctx.lineTo(cx, cy + 3); ctx.lineTo(cx - 3, cy);
          ctx.closePath();
          ctx.fill();
        }
      } else if (blink) {
        ctx.fillStyle = '#3a3a2e';
        ctx.fillRect(fd.x * CELL + 2, fd.y * CELL + 2, CELL - 4, CELL - 4);
      }
    } else {
      // 卡通苹果
      const appleCol = fd.golden ? ['#f4d03f', '#d4a017'] : ['#e74c3c', '#b03a2e'];
      const g3 = ctx.createRadialGradient(cx - 1, cy - 2, 1, cx, cy, 5);
      g3.addColorStop(0, appleCol[0]);
      g3.addColorStop(1, appleCol[1]);
      ctx.fillStyle = g3;
      ctx.beginPath();
      ctx.arc(cx, cy + 1, 4, 0, Math.PI * 2);
      ctx.fill();
      // 叶子 + 果柄
      ctx.strokeStyle = '#6b8e23';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(cx, cy - 2);
      ctx.lineTo(cx + 1, cy - 5);
      ctx.stroke();
      ctx.fillStyle = '#7cb342';
      ctx.beginPath();
      ctx.ellipse(cx + 2, cy - 5, 2.6, 1.4, -0.5, 0, Math.PI * 2);
      ctx.fill();
      // 高光
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath();
      ctx.ellipse(cx - 1.5, cy - 1, 1.2, 0.8, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  // 毒食物：像素骷髅 / 卡通幽灵（觉醒后）
  if (game.poison) {
    const nearEnd = game.poison.ttl <= 8;
    const visible = nearEnd ? Math.floor(performance.now() / 120) % 2 === 0 : blink;
    if (visible) {
      const px2 = game.poison.x * CELL, py2 = game.poison.y * CELL;
      if (aw === 0) {
        ctx.strokeStyle = '#3a3a2e';
        ctx.lineWidth = 2;
        ctx.strokeRect(px2 + 3, py2 + 3, CELL - 6, CELL - 6);
        ctx.fillStyle = '#3a3a2e';
        ctx.fillRect(px2 + 4, py2 + 4, 1, 1);
        ctx.fillRect(px2 + 7, py2 + 4, 1, 1);
        ctx.fillRect(px2 + 4, py2 + 7, 4, 1);
      } else {
        // 小幽灵（漂浮）
        const bob = Math.sin(now / 300 + game.poison.x) * 1.5;
        ctx.fillStyle = '#8d9bd6';
        ctx.beginPath();
        ctx.arc(px2 + 5, py2 + 4 + bob, 4, Math.PI, 0);
        ctx.fill();
        ctx.fillRect(px2 + 1, py2 + 4 + bob, 8, 4);
        // 波浪底
        ctx.beginPath();
        ctx.arc(px2 + 2, py2 + 8 + bob, 1.6, 0, Math.PI * 2);
        ctx.arc(px2 + 5, py2 + 8 + bob, 1.6, 0, Math.PI * 2);
        ctx.arc(px2 + 8, py2 + 8 + bob, 1.6, 0, Math.PI * 2);
        ctx.fill();
        // 眼睛
        ctx.fillStyle = '#222';
        ctx.fillRect(px2 + 3, py2 + 3 + bob, 1.5, 2);
        ctx.fillRect(px2 + 6, py2 + 3 + bob, 1.5, 2);
      }
    }
  }
  // 特效：得分飘字 / 升级横幅（按 dt 推进，帧率无关）
  game.effects.forEach(ef => {
    ef.t += dt;
    if (ef.type === 'score') {
      const alpha = Math.max(0, 1 - ef.t / 550);
      ctx.fillStyle = aw === 0 ? `rgba(90,74,0,${alpha.toFixed(2)})` : `rgba(40,60,120,${alpha.toFixed(2)})`;
      ctx.font = 'bold 10px monospace';
      ctx.fillText(ef.text, ef.x, ef.y - ef.t * 0.04);
    } else if (ef.type === 'levelup') {
      const alpha = Math.max(0, 1 - ef.t / 900);
      ctx.fillStyle = aw === 0 ? `rgba(58,58,46,${alpha.toFixed(2)})` : `rgba(30,80,60,${alpha.toFixed(2)})`;
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('LEVEL UP', 125, 100);
      ctx.textAlign = 'left';
    } else if (ef.type === 'miss') {
      const alpha = Math.max(0, 1 - ef.t / 500);
      ctx.fillStyle = `rgba(120,120,110,${alpha.toFixed(2)})`;
      ctx.font = 'bold 10px monospace';
      ctx.fillText(ef.text, ef.x, ef.y - ef.t * 0.05);
    }
  });
  game.effects = game.effects.filter(ef => ef.t < 1000);
  // 觉醒闪光演出（3 次金色脉冲，递增）
  if (awakenFx) {
    const flash = Math.min(1, awF * 3) * 0.35;
    ctx.fillStyle = `rgba(255,214,64,${flash.toFixed(2)})`;
    ctx.fillRect(0, 0, 250, 200);
  }
  // 屏幕红闪（撞墙/撞自己）
  if (game.state === 'over' && Math.floor(performance.now() / 150) % 2 === 0) {
    ctx.fillStyle = 'rgba(140,30,20,0.28)';
    ctx.fillRect(0, 0, 250, 200);
  }
  // 待机画面：蛇绕圈演示（按帧率节拍，每 200ms 一步）
  if (game.state === 'idle') {
    if (now - game.lastTickAt > 200) {
      const c = game.snake[0];
      const side = game.demoStep % 4;
      const moves = [[1, 0], [0, 1], [-1, 0], [0, -1]];
      const nx = c.x + moves[side][0], ny = c.y + moves[side][1];
      if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
        game.prevSnake = game.snake.map(s => ({ ...s }));
        game.lastTickAt = now;
        game.snake.unshift({ x: nx, y: ny });
        game.snake.pop();
        game.demoStep++;
      }
    }
  }
  let text = '';
  if (game.state === 'idle') text = 'SNAKE II\n按任意键开始';
  else if (game.state === 'paused') text = '已暂停';
  else if (game.state === 'over') text = 'GAME OVER\n得分 ' + game.score + '\n按任意键返回';
  stateText.textContent = text;
  document.getElementById('scoreText').textContent =
    game.combo >= 2 ? 'SCORE ' + game.score + '  COMBO x' + game.combo : 'SCORE ' + game.score;
  const aLabel = game.state === 'paused' ? '继续' : game.state === 'playing' ? '暂停' : '开始';
  const bLabel = game.state === 'playing' ? '难度 ' + DIFFICULTY[game.difficulty].label : '难度';
  btnA.lastChild.textContent = aLabel;
  btnB.lastChild.textContent = bLabel;
}

// 游戏逻辑：setTimeout 按 speedMs 走格（保持复古节奏）
function loop() {
  game.tick();
  setTimeout(loop, game.speedMs);
}

// 渲染：requestAnimationFrame 60 FPS 驱动（动画平滑）
let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(now - lastFrame, 50);
  lastFrame = now;
  render(now, dt);
  requestAnimationFrame(frame);
}

const enterGameplay = new Set([' ', 'p', 'P', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd', 'W', 'A', 'S', 'D']);

function onKey(e) {
  const k = e.key;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') { game.turn(0, -1); e.preventDefault(); }
  else if (k === 'ArrowDown' || k === 's' || k === 'S') { game.turn(0, 1); e.preventDefault(); }
  else if (k === 'ArrowLeft' || k === 'a' || k === 'A') { game.turn(-1, 0); e.preventDefault(); }
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') { game.turn(1, 0); e.preventDefault(); }
  else if (k === ' ' || k === 'p' || k === 'P') { game.togglePause(); e.preventDefault(); }
}

document.addEventListener('keydown', onKey);
loop();
requestAnimationFrame(frame);

// PWA：注册 Service Worker（离线缓存，仅 https 或 localhost 生效）
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

function handleStartKey() {
  if (game.state === 'idle') { game.start(); sounds.play('click'); }
  else if (game.state === 'over') { game.reset(); sounds.play('click'); }
}

document.addEventListener('keydown', e => {
  if (enterGameplay.has(e.key)) handleStartKey();
});

// 隐藏彩蛋：下键 + B 键同时按住 3 秒 → 直接觉醒
const secretHold = { down: 0, b: 0, timer: null };
const SECRET_MS = 3000;

function trySecretAwaken() {
  if (secretHold.down && secretHold.b && (Date.now() - Math.min(secretHold.down, secretHold.b)) >= SECRET_MS) {
    if (!game.awakened) {
      game.awakened = true;
      game.awakenAt = performance.now();
      game.emitEvent('awaken');
      sounds.play('click');
    }
    secretHold.down = 0; secretHold.b = 0;
    clearTimeout(secretHold.timer);
    secretHold.timer = null;
  }
}

document.querySelectorAll('.dpad-btn').forEach(btn => {
  const isDown = btn.dataset.dir === '0,1';
  btn.addEventListener('click', () => {
    const [dx, dy] = btn.dataset.dir.split(',').map(Number);
    game.turn(dx, dy);
    if (game.state === 'idle' || game.state === 'over') handleStartKey();
  });
  if (isDown) {
    btn.addEventListener('pointerdown', () => {
      secretHold.down = Date.now();
      clearTimeout(secretHold.timer);
      secretHold.timer = setTimeout(trySecretAwaken, SECRET_MS);
    });
    btn.addEventListener('pointerup', () => { secretHold.down = 0; clearTimeout(secretHold.timer); secretHold.timer = null; });
  }
});

btnA.addEventListener('click', () => {
  if (game.state === 'idle' || game.state === 'over') { handleStartKey(); }  // 内部已播放点击声
  else { game.togglePause(); sounds.play('click'); }
});

btnB.addEventListener('click', () => {
  game.cycleDifficulty();
  sounds.play('click');
});

btnB.addEventListener('pointerdown', () => {
  secretHold.b = Date.now();
  clearTimeout(secretHold.timer);
  secretHold.timer = setTimeout(trySecretAwaken, SECRET_MS);
});
btnB.addEventListener('pointerup', () => { secretHold.b = 0; clearTimeout(secretHold.timer); secretHold.timer = null; });
</script>
